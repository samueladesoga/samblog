on: [push]
name: Publish blog
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 'latest'
        extended: true
    - run: hugo
    - run: |
        npx --yes firebase-tools@13 deploy --only hosting -m "Trigger: $GITHUB_EVENT_NAME, commit SHA: $GITHUB_SHA" --non-interactive
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
