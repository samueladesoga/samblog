on: [push]
name: Publish blog
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 'latest'
        extended: true
    - run: hugo
    - run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    - run: |
        npx --yes firebase-tools deploy --only hosting -m "Trigger: $GITHUB_EVENT_NAME, commit SHA: $GITHUB_SHA" --non-interactive
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
